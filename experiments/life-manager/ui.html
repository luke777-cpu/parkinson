:root{--green:#237653;--pale:#edf5ef;--line:#e3e9e4;--muted:#758078}*{box-sizing:border-box}body{margin:0;background:#fff;color:#263b30;font:16px 'Malgun Gothic',Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:inherit;border-radius:9px;padding:10px 16px}button:hover{background:var(--pale)}button.primary{background:var(--green);color:white;border-color:var(--green)}header{display:flex;align-items:center;gap:20px;padding:24px 3.5%;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:650}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:2px;color:var(--muted);margin-top:5px}.right{margin-left:auto;display:flex;align-items:center;gap:10px}main{padding:34px 3.5%;max-width:2000px;margin:auto}h1{font-size:34px;letter-spacing:-1.5px;font-weight:500;margin:8px 0}h2{font-size:22px;font-weight:500}p,.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;letter-spacing:2px}.toolbar{display:flex;align-items:center;gap:12px;margin:26px 0}.spacer{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.weekday{font-size:12px;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);text-align:center}.day{min-height:125px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px;cursor:pointer}.day:hover{background:#f8fbf9}.day.other{color:#b3beb6;background:#fcfdfc}.day.today .num{background:var(--green);color:#fff;border-radius:50%;padding:5px 8px}.num{font-size:15px}.note{font-size:13px;line-height:1.7;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.badge{font-size:11px;color:var(--green);background:var(--pale);border-radius:5px;padding:4px 7px;display:inline-block;margin-top:8px}.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:26px}.card{border:1px solid var(--line);border-radius:15px;padding:25px}.card h2{margin:0 0 16px}.medicine{padding:18px 0;border-top:1px solid var(--line)}.medicine b{display:block;margin-bottom:8px}.medicine button{margin-top:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.entry{padding:18px 0;border-bottom:1px solid var(--line)}.entry .row{justify-content:space-between}.empty{padding:28px 0;color:var(--muted);font-size:14px;line-height:1.8}aside{position:fixed;z-index:5;inset:0 auto 0 0;width:290px;background:white;box-shadow:4px 0 30px #1e40252b;padding:25px;display:none}aside.open{display:block}aside button{display:block;width:100%;text-align:left;margin:14px 0}dialog{width:min(760px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:18px;padding:30px;color:inherit}dialog::backdrop{background:#1c302c55}label{display:block;font-size:13px;color:#596c60;margin:15px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cdd9d0;border-radius:7px;background:#fff;color:#263b30}textarea{min-height:110px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.medrow{border-top:1px solid var(--line);margin-top:18px;padding-top:5px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.error{color:#9b3333;white-space:pre-wrap}pre{background:#f6f9f6;padding:14px;overflow:auto;font-size:12px;max-height:240px}.hint{font-size:13px;line-height:1.7;color:var(--muted)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:12px 24px;border-radius:8px;display:none;z-index:10}@media(max-width:850px){.sets{grid-template-columns:1fr}.day{min-height:100px;padding:8px}.brand{font-size:14px}header{gap:10px}.fields{grid-template-columns:1fr}.right .muted{display:none}}
.calendar{height:calc(100vh - 385px);min-height:490px;grid-template-rows:40px repeat(6,minmax(75px,1fr))}.day{min-height:0;overflow:auto}body{font-size:18px}button{min-height:46px}input,select{min-height:46px}.hint{font-size:15px}.badge{font-size:13px}.summary{display:flex;gap:24px;flex-wrap:wrap;background:var(--pale);border-radius:12px;padding:20px;margin:22px 0}.time{font-size:26px;color:var(--green);font-weight:500}.badge.unrecorded{background:#f3f5f3;color:#65746b}.badge.not_taken{background:#f0f2f0;color:#46534b}.previous{background:#f4f7f4;padding:16px;border-radius:10px;margin:15px 0}.medicine b{font-size:20px;margin-top:14px}.medicine p{line-height:1.8}.fields[hidden]{display:none}.calendar{height:calc(100vh - 395px)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.day:focus-visible{outline:3px solid #237653;outline-offset:3px}
.output-chart{width:100%;max-height:300px;display:block}.output-chart text{fill:#758078;font:14px 'Malgun Gothic',sans-serif}.timeline{margin:28px 0}.timeline-row{display:flex;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:flex-start}.timeline-row time{min-width:75px;color:var(--green);font-size:21px}.timeline-row>div{flex:1}.timeline-row p{color:#263b30;line-height:1.8;margin:10px 0}.report-table{border-collapse:collapse;width:100%;font-size:15px}.report-table td,.report-table th{text-align:left;vertical-align:top;padding:13px;border-bottom:1px solid var(--line);line-height:1.7;overflow-wrap:anywhere}.report-table th{background:var(--pale)}.report-table td:first-child{min-width:170px}.reminder-panel{position:fixed;bottom:22px;right:22px;width:350px;max-height:65vh;overflow:auto;background:white;border:2px solid var(--green);padding:24px;box-shadow:0 6px 30px #20302930;border-radius:15px;z-index:4}.reminder-panel[hidden]{display:none}input[type=checkbox]{width:23px;height:23px;min-height:0;vertical-align:middle;margin-right:12px}.large body{font-size:22px}.large .hint,.large label{font-size:18px}.large button,.large input,.large select,.large textarea{font-size:21px;min-height:52px}.large .badge{font-size:16px}h1:focus{outline:none}@media print{header,aside,dialog,.no-print,#toast,#reminderPanel,button,input,label{display:none!important}body{font-size:11pt;color:#000}main{padding:0;max-width:none}.summary{background:#f2f5f2;padding:12px;font-size:10pt}.report-table{font-size:9pt}.report-table td{padding:8px}.report-table tr{break-inside:avoid}thead{display:table-header-group}h1{font-size:22pt}h2{font-size:15pt}.hint{font-size:9pt}.eyebrow{font-size:9pt}}@page{size:A4;margin:15mm}

.scheduler-toolbar h1{font-size:29px;margin:0;letter-spacing:-1px}.mode-switch{display:flex;gap:4px}.planner-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:24px;align-items:start}.planner-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:36px repeat(6,minmax(130px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.planner-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-width:0;min-height:130px}.planner-day.other{background:#fafcfb;color:#87998e}.planner-day.is-today{background:#f1f8f3}.date-row{display:flex;justify-content:space-between;margin-bottom:6px}.date-row button{border:0;min-height:30px;padding:4px 8px;font-size:14px;background:transparent}.is-today .date-row button:first-child{background:var(--green);color:white;border-radius:50%}.schedule-chip{display:block;width:100%;min-height:28px;text-align:left;border:0;border-left:3px solid var(--green);background:#eef6f0;border-radius:4px;padding:6px;font-size:12px;line-height:1.6;margin:4px 0;overflow:hidden;overflow-wrap:anywhere}.schedule-chip span:first-child{font-weight:700;white-space:nowrap}.schedule-chip.med-chip{background:white;border:1px dashed #9ebcaa;border-left:3px solid #9ebcaa}.schedule-chip.done{opacity:.65}.schedule-chip.not_done{background:#f1f2f1;color:#738078}.schedule-chip small{font-size:10px;display:block}.more,.memo-button{min-height:26px;padding:4px;border:0;font-size:12px;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}.memo-button{text-align:left;color:var(--muted)}aside.task-rail{display:block;position:static;inset:auto;width:auto;z-index:auto;background:#f9fbf9;box-shadow:none;border:1px solid var(--line);border-radius:12px;padding:18px}.task-rail h2{font-size:18px;margin:0}.task-rail .hint{font-size:12px}.task-chip{display:block;width:100%;background:white;text-align:left;padding:12px;font-size:14px}.task-chip small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.today-overview{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.today-overview section{padding:24px;background:var(--pale);border-radius:12px}.agenda-row{display:flex;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:22px 0}.agenda-row time{font-size:22px;color:var(--green);min-width:70px}.agenda-row>div{flex:1}.agenda-row p{margin-bottom:0}.inline-check{display:inline-block;margin-right:12px}.week-scroll{overflow:auto;max-height:calc(100vh - 280px);border:1px solid var(--line);position:relative}.week-heading,.week-all-day,.week-grid{display:grid;grid-template-columns:55px repeat(7,minmax(110px,1fr));min-width:900px}.week-heading{position:sticky;top:0;background:white;z-index:3}.week-heading>div,.week-heading>button{padding:10px 4px;border-radius:0;border:0;border-bottom:1px solid var(--line);font-size:14px;min-height:44px}.week-heading .week-today{color:var(--green);background:var(--pale)}.week-all-day{position:sticky;top:44px;background:white;z-index:2}.week-all-day>div{border-right:1px solid var(--line);padding:4px;max-height:110px;overflow:auto;font-size:12px}.week-grid{height:1152px}.hour-labels{position:relative;font-size:11px;color:var(--muted)}.hour-labels span{position:absolute;right:6px}.week-column{position:relative;height:1152px;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#f0f4f1 23px,#f0f4f1 24px,transparent 24px,transparent 47px,#dfe8e2 47px,#dfe8e2 48px)}.week-event{position:absolute;min-height:30px;padding:1px}.week-event .schedule-chip{position:relative;margin:0;min-height:0;height:100%;font-size:11px;line-height:1.45;padding:4px 5px 8px}.week-event .schedule-chip small{font-size:9px}.resize-handle{position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;background:#2376532a;touch-action:none}.large .schedule-chip{font-size:15px}.large .week-event .schedule-chip{font-size:12px;min-height:0}.large .date-row .planner-month{height:calc(100vh - 280px);min-height:620px;grid-template-rows:36px repeat(6,minmax(0,1fr))}.planner-day{min-height:0;overflow:auto}.planner-month .schedule-chip{white-space:nowrap;text-overflow:ellipsis;min-height:24px;padding:4px;margin:3px 0;font-size:12px}.planner-month .schedule-chip small{display:none}.overlap-count{margin-bottom:12px;color:var(--green);background:var(--pale);font-size:14px}
.task-rail .row h2{flex:1}.task-rail .row button{width:38px;min-height:34px;flex:0 0 38px;margin:0;padding:4px;text-align:center}</style>
<header><button id="menu" aria-label="메뉴 열기">☰</button><div class="brand">Parkinson Life Manager<small>PLAN YOUR DAY</small></div><div class="right"><span class="muted" style="font-size:12px">LOCAL · v1.2 diary experiment</span><button id="full">전체화면</button><button id="exit">종료</button></div></header>
<aside id="nav"><div class="eyebrow">LIFE MANAGER</div><button data-view="calendar">월간 달력</button><button data-view="today">오늘의 계획</button><button data-view="tasks">할 일 · 하루 틀</button><button data-view="timeline">실제 기록 시간표</button><button data-view="medication">복약</button><button data-view="exercise">운동</button><button data-view="diary">기존 약효일지 · 실험</button><button data-view="symptoms">약효 · 증상</button><button data-view="data">데이터 · 변경 이력</button><button data-view="reports">월간 보고서 · PDF</button><button data-view="settings">설정 · 알림</button><button id="closeNav">닫기</button></aside><main id="app"></main><dialog id="modal"><form id="form"><div id="dialogBody"></div><div class="error" id="err" role="alert"></div><div class="actions"><button type="button" id="cancel">취소</button><button class="primary" id="submit">저장</button></div></form></dialog><div id="toast" role="status"></div>
<script>
let closing=false;const token='__TOKEN__';const $=s=>document.querySelector(s);let daily={plans:[],sets:[],legacy:[]};let state={events:[],conflicts:[]},view='calendar',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),chosen=dateKey(new Date());
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function offset(){let n=-new Date().getTimezoneOffset();return(n>=0?'+':'-')+String(Math.floor(Math.abs(n)/60)).padStart(2,'0')+':'+String(Math.abs(n)%60).padStart(2,'0')}
function iso(local){if(!local)throw Error('시각을 직접 입력하세요.');return local.length===16?local+':00'+offset():local}
function local(s){let d=new Date(s);return dateKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function atDate(e){return dateKey(new Date(e.occurred_at))===chosen}
function active(kind){return state.events.filter(e=>!e.deleted&&e.kind===kind)}
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-PLM-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.error);return x}
async function refresh(){state=await api('state');daily=await api('day',{date:chosen,timezone:offset()});render()}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
function field(label,id,value='',type='text'){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" required>`}
function select(label,id,options,value){return `<label for="${id}">${label}</label><select id="${id}">${options.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function noteField(v=''){return `<label for="note">메모</label><textarea id="note">${esc(v)}</textarea>`}
function openDialog(html,save,label='저장'){
 $('#dialogBody').innerHTML=html;$('#err').textContent='';$('#submit').textContent=label;$('#submit').hidden=!save;$('#submit').disabled=false;$('#modal').showModal();
 $('#form').onsubmit=async e=>{e.preventDefault();if($('#submit').disabled)return;$('#submit').disabled=true;$('#cancel').disabled=true;try{await save();$('#modal').close();if(!closing){await refresh();toast('저장했습니다.')}else $('#app').innerHTML='<h1>종료되었습니다.</h1><p>이 창을 닫으셔도 됩니다.</p>'}catch(x){$('#err').textContent=x.message}finally{$('#submit').disabled=false;$('#cancel').disabled=false}};
}
async function save(kind,payload,occurred,old=null,extra={}){return api('save',{kind,payload,occurred_at:occurred,timezone:occurred.slice(-6),id:old?.id,expected_revision:old?.revision_id,...extra})}
function title(k,t,sub){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p>${sub}</p>`}
function dateToolbar(){return `<div class="toolbar"><label for="date" style="margin:0">기록 날짜</label><input id="date" type="date" value="${chosen}" style="width:auto"><span class="spacer"></span><span class="hint">${view==='medication'?'선택한 날짜의 예정과 실제 기록입니다.':'입력한 기록만 표시합니다.'}</span></div>`}
function render(){let html='';
 if(view==='calendar'){
 html=title('YOUR MONTH','하루의 리듬을, 한눈에.','날짜를 누르면 하루 기록과 메모를 확인할 수 있습니다.');html+=`<div class="toolbar"><button id="prev" aria-label="이전 달">‹</button><h2>${month.getFullYear()}년 ${month.getMonth()+1}월</h2><button id="next" aria-label="다음 달">›</button><span class="spacer"></span><button id="today">오늘</button></div><div class="calendar">`;
 for(let name of ['일','월','화','수','목','금','토'])html+=`<div class="weekday">${name}</div>`;
 let start=new Date(month);start.setDate(1-start.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=dateKey(d),exerciseCount=active('exercise').filter(e=>dateKey(new Date(e.occurred_at))===key).length,n=active('note').filter(e=>e.payload.date===key),count=active('medication').filter(e=>(e.payload.scheduled_at?.slice(0,10)||dateKey(new Date(e.occurred_at)))===key&&(e.payload.completed||e.payload.status==='taken')).length;html+=`<div tabindex="0" role="button" aria-label="${key} 메모" data-day="${key}" class="day ${d.getMonth()!==month.getMonth()?'other':''} ${key===dateKey(new Date())?'today':''}"><span class="num">${d.getDate()}</span>${n.map(e=>`<div class="note">${esc(e.payload.text)}</div>`).join('')}${count?`<span class="badge">복약 ${count}건</span>`:''}${exerciseCount?`<span class="badge">운동 ${exerciseCount}건</span>`:''}</div>`}html+='</div>';
 } else if(view==='medication'){
 html=medicationPage();
 }else if(view==='exercise'||view==='symptoms'){
 let exercise=view==='exercise';html=title(exercise?'MOVEMENT':'OBSERVATIONS',exercise?'오늘의 움직임':'약효 · 증상',exercise?'운동의 종류와 시간을 별도로 기록합니다.':'약효 Output과 증상은 각각 독립된 이벤트로 저장합니다. ON/OFF는 직접 선택한 경우에만 기록합니다.')+dateToolbar()+`<button class="primary" id="addEvent">+ ${exercise?'운동':'약효 · 증상'} 기록</button>`;
 let events=state.events.filter(e=>!e.deleted&&atDate(e)&&(exercise?e.kind==='exercise':['output','motor_state','dyskinesia','dystonia','freezing'].includes(e.kind))).sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at));
 if(!events.length)html+='<div class="empty">이 날짜에 기록이 없습니다.</div>';
 for(let e of events){let p=e.payload;html+=`<div class="entry"><div class="row"><div><b>${esc(exercise?p.name:labels[e.kind])}</b> <span class="badge">${esc(p.minutes?p.minutes+'분':p.value??p.state??p.severity)}</span><p class="hint">${esc(local(e.occurred_at).replace('T',' '))} · ${esc(p.note)}</p></div><button data-event="${e.id}">수정</button></div></div>`}
 }else{
 html=title('LOCAL DATA','기록을 안전하게 이어가기','SQLite 로컬 저장 · JSON 교환 형식 plm-1.1 · 외부 약효일지와의 연결은 아직 구현되지 않았습니다.')+`<div class="toolbar"><button id="export" class="primary">JSON 내보내기</button><button id="import">JSON 가져오기</button><input type="file" id="file" accept=".json" hidden></div><p class="hint">같은 수정 UUID는 한 번만 반영됩니다. 양쪽에서 수정한 기록은 자동 덮어쓰기 없이 충돌 목록에 보관합니다.<br>수정·삭제도 새 버전으로 남습니다. 내보낸 JSON에는 건강 기록이 포함됩니다.</p><h2>미해결 충돌 ${state.conflicts.length}건</h2>`;
 for(let c of state.conflicts)html+=`<div class="entry row"><span>${esc(c.entity_id)}</span><button data-conflict="${c.revision_id}" data-entity="${c.entity_id}">비교 · 해결</button></div>`;
 html+='<h2>현재 기록 · 변경 이력</h2>';for(let e of state.events)html+=`<div class="entry row"><span>${esc(labels[e.kind]||e.kind)} · ${esc(e.payload.name||e.payload.slot||e.payload.date||'')} · v${e.version}${e.deleted?' · 삭제됨':''}</span><button data-history="${e.id}">변경 이력</button>${!e.deleted&&e.kind!=='medication_set'?`<button data-delete="${e.id}">삭제 기록</button>`:''}</div>`;
 }
 $('#app').innerHTML=html;bind();
}
const labels={medication_set:'복약 세트',medication:'복용',output:'약효 Output',motor_state:'ON/OFF',dyskinesia:'이상운동증 · dyskinesia',dystonia:'근긴장이상 · dystonia',freezing:'동결 · freezing',exercise:'운동',note:'메모'};
function bind(){
 if($('#date'))$('#date').onchange=async e=>{if(!e.target.value)return;chosen=e.target.value;try{await refresh()}catch(x){toast(x.message)}};
 if($('#prev')){$('#prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};$('#next').onclick=()=>{month.setMonth(month.getMonth()+1);render()};$('#today').onclick=()=>{month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}}
 document.querySelectorAll('[data-day]').forEach(b=>{b.onclick=()=>dayDetails(b.dataset.day);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});
 document.querySelectorAll('[data-newset]').forEach(b=>b.onclick=()=>editSet2(b.dataset.newset));
 document.querySelectorAll('[data-editset]').forEach(b=>b.onclick=()=>{let e=find(b.dataset.editset);editSet2(e.payload.slot,e)});
 document.querySelectorAll('[data-copyset]').forEach(b=>b.onclick=()=>{let e=find(b.dataset.copyset);editSet2(e.payload.slot,null,e)});
 document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>editPlan(daily.plans.find(p=>p.plan_id===b.dataset.plan)));
 document.querySelectorAll('[data-legacy]').forEach(b=>b.onclick=()=>editLegacy(find(b.dataset.legacy)));
 document.querySelectorAll('[data-note-date]').forEach(b=>b.onclick=()=>editNote(b.dataset.noteDate));
 if($('#addEvent'))$('#addEvent').onclick=()=>editEvent();document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>editEvent(find(b.dataset.event)));
 if($('#export')){$('#export').onclick=async()=>{try{let data=await api('export'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='PLM-'+dateKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){toast(e.message)}};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('파일은 20MB 이하로 선택하세요.');let doc=JSON.parse(await f.text());let r=await api('import',doc);await refresh();toast(`추가 ${r.added} · 중복 ${r.duplicates} · 충돌 ${r.conflicts}`)}catch(x){toast(x.message)}}}
 document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>history(b.dataset.history));document.querySelectorAll('[data-conflict]').forEach(b=>b.onclick=()=>resolve(b.dataset.entity,b.dataset.conflict));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let e=find(b.dataset.delete);openDialog('<h2>삭제 기록 남기기</h2><p>기존 이력은 보존되고, 현재 화면에서 숨겨집니다.</p>',()=>save(e.kind,e.payload,e.occurred_at,e,{deleted:true}),'삭제 기록 저장')});
}
function find(id){return state.events.find(e=>e.id===id)}
function editNote(date){let old=active('note').find(e=>e.payload.date===date);openDialog(`<h2>${date} 메모</h2>`+noteField(old?.payload.text),()=>save('note',{date,text:$('#note').value},iso(date+'T12:00'),old))}
function medicationPage(){
 let html=title('MEDICATION','나의 복약','예정은 날짜별로, 실제 복용은 직접 기록합니다.')+dateToolbar();
 const taken=daily.plans.filter(p=>p.record&&!p.record.deleted&&p.record.payload.status==='taken').length;
 const missed=daily.plans.filter(p=>p.record&&!p.record.deleted&&p.record.payload.status==='not_taken').length;
 html+=`<div class="summary"><b>예정 ${daily.plans.length}</b><span>기록 전 ${daily.plans.length-taken-missed}</span><span>복용 완료 ${taken}</span><span>미복용 ${missed}</span>${daily.legacy.length?`<span>기존 기록 ${daily.legacy.length}</span>`:''}</div><div class="sets">`;
 for(const slot of ['아침','점심','저녁']){
  const plans=daily.plans.filter(p=>p.slot===slot);
  html+=`<section class="card"><div class="row"><h2>${slot}</h2><button data-newset="${slot}">+ 세트</button></div>`;
  if(!plans.length)html+='<div class="empty">이 날짜에 예정된 약이 없습니다.</div>';
  for(const p of plans){const rec=p.record&&!p.record.deleted?p.record:null,status=rec?.payload.status||'unrecorded';
   html+=`<div class="medicine"><div class="row"><span class="time">${esc(p.scheduled_at.slice(11,16))}</span><span class="badge ${status}">${status==='taken'?'복용 완료':status==='not_taken'?'미복용':'기록 전'}</span></div><b>${esc(p.name)}</b><p class="hint">${esc(p.form)} · 예정 용량 ${esc(p.planned_dose)}</p>${rec?`<p class="hint">${status==='taken'?`실제 ${esc(local(rec.payload.actual_at).replace('T',' '))}<br>실제 용량 ${esc(rec.payload.dose)}`:'사용자가 미복용으로 기록함'}<br>${esc(rec.payload.note)}</p>`:''}<button class="${rec?'':'primary'}" data-plan="${p.plan_id}">${rec?'기록 수정':'복용 여부 기록'}</button></div>`;
  }
  for(const old of daily.legacy.filter(e=>e.payload.slot===slot))html+=`<div class="medicine"><span class="badge">v0.1 기존 기록 · ${old.payload.completed?'복용 완료':'미완료 (미복용 아님)'}</span><b>${esc(old.payload.name)}</b><p class="hint">실제 ${old.payload.actual_at?esc(local(old.payload.actual_at)):'미입력'} · ${esc(old.payload.dose)}</p><button data-legacy="${old.id}">기존 기록 확인 · 수정</button></div>`;
  html+='</section>';
 }
 html+='</div><h2 style="margin-top:35px">복약 세트 관리</h2><p class="hint">세트 변경은 지정한 시작일부터 적용됩니다. 약이 바뀌어도 지난 복용 기록은 보존됩니다.</p>';
 for(const e of state.events.filter(e=>e.kind==='medication_set'&&!e.deleted))html+=`<div class="entry row"><div><b>${esc(e.payload.slot)} 세트</b> · 적용 시작 ${esc(e.payload.effective_date||e.occurred_at.slice(0,10))}<br><span class="hint">${e.payload.enabled===false?'사용 중지 예약 · ':''}${e.payload.medicines.map(m=>esc(m.name)).join(' · ')}</span></div><span class="spacer"></span><button data-copyset="${e.id}">세트 복사</button><button data-editset="${e.id}">편집 · 사용 중지</button></div>`;
 return html;
}
function editSet2(slot,old,copy){
 const source=old||copy,today=dateKey(new Date()),effective=old?.payload.effective_date||chosen;
 openDialog(`<h2>${copy?'세트 복사':old?'세트 편집':'복약 세트 만들기'}</h2><p class="hint">적용일 이후의 예정 목록이 바뀝니다. 이미 복용 기록이 있는 날짜는 변경할 수 없습니다.</p><div class="fields"><div>${select('구분','slot',['아침','점심','저녁'],slot)}</div><div>${field('적용 시작일','effective',effective<today?today:effective,'date')}</div></div>${select('세트 사용','enabled',['사용','사용 중지'],old?.payload.enabled===false?'사용 중지':'사용')}<div id="meds"></div><button type="button" id="addmed">+ 약 추가</button>`,()=>{
  const medicines=[...document.querySelectorAll('.medrow')].map(row=>({medicine_id:row.dataset.mid,...Object.fromEntries(['name','form','dose','time'].map(k=>[k,row.querySelector('[data-k="'+k+'"]').value]))}));
  return save('medication_set',{slot:$('#slot').value,medicines,effective_date:$('#effective').value,enabled:$('#enabled').value==='사용'},iso($('#effective').value+'T00:00'),old);
 },old?'새 버전으로 저장':'세트 저장');$('#effective').min=today;
 function add(m={}){const el=document.createElement('div');el.className='medrow';el.dataset.mid=(!copy&&m.medicine_id)||crypto.randomUUID();el.innerHTML='<div class="fields">'+[['name','약명','text'],['form','제형','text'],['dose','예정 용량 (단위 포함)','text'],['time','예정시간','time']].map(([k,n,t])=>`<div><label>${n}<input data-k="${k}" type="${t}" value="${esc(m[k]||'')}" required></label></div>`).join('')+'</div><button type="button">이 약 제거</button>';el.querySelector('button').onclick=()=>el.remove();$('#meds').append(el)}
 (source?.payload.medicines||[{}]).forEach(add);$('#addmed').onclick=()=>add();
}
function recordSummary(e){if(!e||e.deleted)return '기록 전';const p=e.payload;return `${p.status==='taken'?'복용 완료':'미복용'} · ${p.actual_at?local(p.actual_at):'실제 시각 없음'} · ${p.dose||'실제 용량 없음'} · ${p.note||''}`}
function editPlan(plan){
 const old=plan.record,p=old&&!old.deleted?old.payload:null;
 openDialog(`<h2>${esc(plan.name)} · 복용 기록</h2><p class="hint">예정 ${esc(plan.scheduled_at.replace('T',' ').slice(0,16))} · ${esc(plan.form)} · 예정 용량 ${esc(plan.planned_dose)}</p>${old?`<div class="previous"><b>수정 전 기록 · v${old.version}</b><p>${esc(recordSummary(old))}</p><span class="hint">수정 전 내용은 보존됩니다.</span></div>`:''}${select('복용 상태','status',['선택하세요','복용 완료','미복용'],p?.status==='taken'?'복용 완료':p?.status==='not_taken'?'미복용':'선택하세요')}<div id="actualFields" class="fields"><div>${field('실제 복용시간','actual',p?.actual_at?local(p.actual_at):'','datetime-local')}</div><div>${field('실제 복용 용량 (단위 포함)','dose',p?.dose||'')}</div></div>`+noteField(p?.note)+`<p class="hint">실제 시각과 용량은 직접 입력하세요. 예정 값으로 채우지 않습니다.</p>${p?'<button type="button" id="undoRecord">기록 취소 · 기록 전으로 되돌리기</button>':''}`,()=>{
  const status=$('#status').value;
  if(status==='선택하세요')throw Error('복용 완료 또는 미복용을 직접 선택하세요.');
  const actual=status==='복용 완료'?iso($('#actual').value):null;
  const payload={...Object.fromEntries(['plan_id','medicine_id','set_id','set_revision_id','slot','name','form','planned_dose','scheduled_at'].map(k=>[k,plan[k]])),status:status==='복용 완료'?'taken':'not_taken',dose:status==='복용 완료'?$('#dose').value:null,actual_at:actual,note:$('#note').value};
  return save('medication',payload,actual||plan.scheduled_at,old);
 },old?'수정 내용을 새 버전으로 저장':'기록 저장');
 function statusFields(){const taken=$('#status').value==='복용 완료';$('#actualFields').hidden=!taken;$('#actual').required=taken;$('#dose').required=taken;$('#actual').disabled=!taken;$('#dose').disabled=!taken}
 $('#status').onchange=statusFields;statusFields();
 if($('#undoRecord'))$('#undoRecord').onclick=()=>{openReplace(`<h2>기록 취소</h2><p>기록 전 상태로 돌리고 취소 이력을 남깁니다. 이전 복용 기록은 삭제되지 않습니다.</p>`,()=>save('medication',old.payload,old.occurred_at,old,{deleted:true}),'취소 이력 저장')};
}
function openReplace(html,save,label){$('#modal').close();openDialog(html,save,label)}
function editLegacy(old){const p=old.payload;openDialog(`<h2>v0.1 기존 복용 기록</h2><p>${esc(p.name)} · ${esc(p.form)}</p><p class="hint">기존 미완료는 미복용을 의미하지 않습니다. 새 상태로 추정 변환하지 않습니다.</p><div class="previous">수정 전: ${esc(p.actual_at||'실제 시각 없음')} · ${esc(p.dose)}</div>`+field('실제 복용시간','actual',p.actual_at?local(p.actual_at):'','datetime-local')+field('기록된 용량','dose',p.dose)+select('기존 완료 여부','completed',['복용 완료','기존 미완료'],p.completed?'복용 완료':'기존 미완료'),()=>save('medication',{...p,dose:$('#dose').value,actual_at:$('#actual').value?iso($('#actual').value):null,completed:$('#completed').value==='복용 완료'},$('#actual').value?iso($('#actual').value):p.scheduled_at,old),'새 버전으로 저장');$('#actual').required=false;}
async function dayDetails(day){
 try{chosen=day;await refresh();const note=active('note').find(e=>e.payload.date===day),ex=active('exercise').filter(atDate);openDialog(`<h2>${day} 하루 기록</h2><div class="summary">복약 예정 ${daily.plans.length}건 · 운동 ${ex.length}건</div><p>${esc(note?.payload.text||'아직 메모가 없습니다.')}</p><div class="row"><button type="button" id="dayMeds">복약 보기</button><button type="button" id="dayExercise">운동 보기</button><button type="button" id="dayNote">메모 작성 · 수정</button><button type="button" id="dayTimeline">하루 시간표</button></div>`,null);$('#dayMeds').onclick=()=>{$('#modal').close();view='medication';render()};$('#dayExercise').onclick=()=>{$('#modal').close();view='exercise';render()};$('#dayTimeline').onclick=()=>{$('#modal').close();view='timeline';render()};$('#dayNote').onclick=()=>{$('#modal').close();editNote(day)};}catch(e){toast(e.message)}
}
function editEvent(old){let exercise=view==='exercise',kind=old?.kind||(exercise?'exercise':'output');openDialog(`<h2>${exercise?'운동':'약효 · 증상'} 기록</h2>`+(!exercise&&!old?select('기록 종류','kind',['output','motor_state','dyskinesia','dystonia','freezing'],kind):'')+field('기록 시각','occurred',old?local(old.occurred_at):'','datetime-local')+'<div id="eventFields"></div>',()=>{let k=$('#kind')?.value||kind,p={note:$('#note').value};if(k==='exercise'){p.name=$('#name').value;p.minutes=Number($('#minutes').value)}else if(k==='output')p.value=Number($('#value').value);else if(k==='motor_state')p.state=$('#state').value;else p.severity=$('#severity').value;return save(k,p,iso($('#occurred').value),old)});
 function fields(){let k=$('#kind')?.value||kind,p=old?.payload||{};$('#eventFields').innerHTML=(k==='exercise'?field('운동명','name',p.name)+field('운동 시간 (분)','minutes',p.minutes,'number'):k==='output'?field('약효 Output (0~100)','value',p.value??'','number'):k==='motor_state'?select('직접 선택한 상태','state',['선택하세요','ON','OFF'],p.state||'선택하세요'):select('증상 정도','severity',['기록함','경도','중등도','심함'],p.severity))+noteField(p.note);if($('#value')){$('#value').min=0;$('#value').max=100}if($('#minutes')){$('#minutes').min=1;$('#minutes').max=1440}}fields();if($('#kind'))$('#kind').onchange=fields;
}
async function history(id){try{let all=await api('history/'+id);openDialog('<h2>변경 이력</h2>'+all.map(e=>`<p>v${e.version} · ${esc(e.modified_at)}${e.deleted?' · 삭제됨':''}</p><pre>${esc(JSON.stringify(e,null,2))}</pre>`).join(''),null)}catch(e){toast(e.message)}}
async function resolve(id,rid){try{
 const all=await api('history/'+id),current=find(id),incoming=all.find(e=>e.revision_id===rid),isSet=current.kind==='medication_set';
 const earliest=[dateKey(new Date()),current.payload.effective_date||current.occurred_at.slice(0,10)].sort().at(-1);
 openDialog(`<h2>충돌 비교</h2><p>두 버전을 보존하고 선택한 내용을 새 버전으로 저장합니다.</p><b>현재</b><pre>${esc(JSON.stringify(current,null,2))}</pre><b>가져온 버전</b><pre>${esc(JSON.stringify(incoming,null,2))}</pre>`+select('보존할 내용','choice',['현재 내용 유지','가져온 내용 사용'],'현재 내용 유지')+(isSet?field('선택한 세트 내용의 적용 시작일','resolveDate',earliest,'date')+'<p class="hint">기록이 있는 날짜를 바꾸지 않도록 마지막 복용 기록 다음 날부터 적용하세요.</p>':''),()=>{
  const picked=$('#choice').value==='현재 내용 유지'?current:incoming;let payload=picked.payload,occurred=picked.occurred_at,deleted=picked.deleted;
  if(isSet){payload={slot:payload.slot,enabled:!picked.deleted&&payload.enabled!==false,effective_date:$('#resolveDate').value,medicines:payload.medicines.map(m=>({...m,medicine_id:m.medicine_id||crypto.randomUUID()}))};occurred=iso(payload.effective_date+'T00:00');deleted=false}
  return save(current.kind,payload,occurred,current,{deleted,resolve:[rid]});
 },'선택한 내용으로 새 버전 저장');
 if(isSet)$('#resolveDate').min=earliest;
}catch(e){toast(e.message)}}
